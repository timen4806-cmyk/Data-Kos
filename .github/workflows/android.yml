name: Android CI/CD Build & APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Test, Build & Package APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36.1
            build-tools;36.0.0

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'

      - name: Configure google-services.json (from Secret if provided)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          fi

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit & Robolectric Tests
        run: |
          gradle :app:testDebugUnitTest \
            --tests 'com.example.ExampleUnitTest' \
            --tests 'com.example.ExampleRobolectricTest' \
            --no-daemon

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/WargaKos-debug.apk

      - name: Build Signed Release APK (when keystore secrets are configured)
        id: release_build
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > my-upload-key.jks
            gradle :app:assembleRelease --no-daemon
            mkdir -p dist
            cp app/build/outputs/apk/release/app-release.apk dist/WargaKos-release.apk
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Debug APK Artifact (Downloadable from Actions)
        uses: actions/upload-artifact@v6
        with:
          name: WargaKos-debug-apk
          path: dist/WargaKos-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release APK Artifact (if built)
        if: steps.release_build.outputs.built == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: WargaKos-release-apk
          path: dist/WargaKos-release.apk
          retention-days: 30

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish Direct APK to GitHub Release (on tag push v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*.apk
          generate_release_notes: true

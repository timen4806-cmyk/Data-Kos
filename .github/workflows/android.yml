name: Android CI/CD Build & APK

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Test, Build & Package APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK & Accept Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ -d "$SDK_DIR" ] && command -v sudo >/dev/null 2>&1; then
            sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR"
            chmod -R u+rwX "$SDK_DIR" || true
          fi
          mkdir -p "$SDK_DIR/licenses"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found in $SDK_DIR"
            exit 1
          fi

          # Accept SDK licenses without triggering pipefail SIGPIPE
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
          set -o pipefail

          # Ensure latest cmdline-tools are available so SDK 36 metadata resolves cleanly
          "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "cmdline-tools;latest" || true
          if [ -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

          "$SDKMANAGER" --sdk_root="$SDK_DIR" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses > /dev/null || true
          set -o pipefail

          ls -la "$SDK_DIR/platforms" "$SDK_DIR/licenses" || true

      - name: Set up Gradle 9.9.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.0'

      - name: Configure google-services.json (from Secret if provided)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "${GOOGLE_SERVICES_JSON_B64:-}" ]; then
            echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          fi

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ] && base64 -d debug.keystore.base64 > debug.keystore; then
              echo "Restored debug.keystore from debug.keystore.base64"
            else
              rm -f debug.keystore
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit & Robolectric Tests
        timeout-minutes: 15
        run: |
          gradle --version
          set -o pipefail
          if ! gradle :app:testDebugUnitTest \
            --tests 'com.example.ExampleUnitTest' \
            --tests 'com.example.ExampleRobolectricTest' \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            --console=plain --no-daemon --no-configuration-cache --stacktrace 2>&1 | tee test-run.log; then
            echo "=== Kotlin / Gradle Failure Summary ==="
            grep -E "^e: |FAILURE:|What went wrong:|Execution failed|FAILED" test-run.log | head -n 20 || true
            SUMMARY=$(grep -E "^e: |FAILURE:|What went wrong:|Execution failed" test-run.log | head -n 6 | tr '\n' ' ')
            echo "::error title=Tests or Compilation Failed::${SUMMARY:-See Run Unit & Robolectric Tests log or unit-test-reports/test-run.log}"
            exit 1
          fi

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            --no-daemon --no-configuration-cache --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/WargaKos-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk WargaKos-debug.apk

      - name: Build Signed Release APK (when keystore secrets are configured)
        id: release_build
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        run: |
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > my-upload-key.jks
            gradle :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace
            mkdir -p dist
            cp app/build/outputs/apk/release/app-release.apk dist/WargaKos-release.apk
            cp app/build/outputs/apk/release/app-release.apk WargaKos-release.apk
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Debug APK Artifact (Downloadable from Actions)
        uses: actions/upload-artifact@v6
        with:
          name: WargaKos-debug-apk
          path: WargaKos-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release APK Artifact (if built)
        if: steps.release_build.outputs.built == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: WargaKos-release-apk
          path: WargaKos-release.apk
          retention-days: 30

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            test-run.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Publish Direct APK to GitHub Release (Always on Push & Tag)
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Rilis Versi {0}', github.ref_name) || 'WargaKos Build APK Terbaru (Latest)' }}
          body: |
            ### WargaKos — Aplikasi Data Warga Kos (Android Native)
            File APK ini diperbarui secara otomatis setiap kali ada `push` ke repositori GitHub.
            
            **Petunjuk Instalasi:**
            1. Unduh file **`WargaKos-debug.apk`** langsung pada daftar **Assets** di bawah.
            2. Buka file `.apk` di HP Android Anda untuk langsung menginstal aplikasi WargaKos.
          files: |
            dist/WargaKos-debug.apk
          generate_release_notes: true
